<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none">
  <!-- Table edge -->
  <rect x="10" y="58" width="100" height="6" rx="2" fill="#c9956a"/>

  <!-- Left ear -->
  <path d="M30 30 L22 12 L38 22 Z" fill="#ede8df"/>
  <path d="M31 28 L26 16 L36 23 Z" fill="#c9956a" opacity="0.5"/>

  <!-- Right ear -->
  <path d="M90 30 L82 22 L98 12 Z" fill="#ede8df"/>
  <path d="M89 28 L84 23 L94 16 Z" fill="#c9956a" opacity="0.5"/>

  <!-- Head -->
  <ellipse cx="60" cy="42" rx="28" ry="22" fill="#ede8df"/>

  <!-- Mask - left -->
  <ellipse cx="46" cy="39" rx="12" ry="8" fill="#2a2542"/>
  <!-- Mask - right -->
  <ellipse cx="74" cy="39" rx="12" ry="8" fill="#2a2542"/>

  <!-- Eyes -->
  <circle cx="46" cy="39" r="3.5" fill="#ede8df"/>
  <circle cx="46" cy="39" r="2" fill="#181622"/>
  <circle cx="74" cy="39" r="3.5" fill="#ede8df"/>
  <circle cx="74" cy="39" r="2" fill="#181622"/>
  <!-- Eye shine -->
  <circle cx="47.5" cy="38" r="0.8" fill="#ede8df"/>
  <circle cx="75.5" cy="38" r="0.8" fill="#ede8df"/>

  <!-- Nose -->
  <ellipse cx="60" cy="48" rx="3" ry="2.5" fill="#2a2542"/>

  <!-- Muzzle light patches -->
  <ellipse cx="53" cy="50" rx="5" ry="3.5" fill="#f5f0e8"/>
  <ellipse cx="67" cy="50" rx="5" ry="3.5" fill="#f5f0e8"/>

  <!-- Dark stripe down forehead -->
  <path d="M57 20 Q60 35 63 20" fill="#2a2542" opacity="0.6"/>

  <!-- Left paw on table -->
  <rect x="25" y="53" width="16" height="8" rx="4" fill="#ede8df"/>
  <!-- Paw toes left -->
  <circle cx="29" cy="53" r="2.5" fill="#ede8df"/>
  <circle cx="34" cy="52.5" r="2.5" fill="#ede8df"/>
  <circle cx="38.5" cy="53" r="2.5" fill="#ede8df"/>

  <!-- Right paw on table -->
  <rect x="79" y="53" width="16" height="8" rx="4" fill="#ede8df"/>
  <!-- Paw toes right -->
  <circle cx="81.5" cy="53" r="2.5" fill="#ede8df"/>
  <circle cx="86" cy="52.5" r="2.5" fill="#ede8df"/>
  <circle cx="91" cy="53" r="2.5" fill="#ede8df"/>
</svg>
