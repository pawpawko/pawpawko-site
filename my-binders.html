  <section class="section" style="padding-top: 8rem;">
    <div class="container container-wide">
      <div id="setupNotice"></div>

      <div id="signedOutPreview" style="display:none;">
        <div class="signed-out-preview">
          <p class="demo-header">
            <img class="demo-star" src="images/star-rate.svg" alt="" aria-hidden="true">
            <span>demo binders, <a href="account.html">sign up</a>/<a href="account.html">sign in</a> to start collecting and trading</span>
            <img class="demo-star" src="images/star-rate.svg" alt="" aria-hidden="true">
          </p>
        </div>
        <div class="demo-carousel" id="binderCarousel">
          <div class="demo-carousel-row">
            <button class="demo-carousel-nav prev" type="button" aria-label="Previous binder">‹</button>
            <div class="demo-carousel-viewport">
              <div class="demo-carousel-track">
                <div class="demo-carousel-slide"><iframe class="demo-binder-frame" data-cat="optcg" data-src="binder.html?demo=optcg" title="One Piece binder demo" scrolling="no"></iframe></div>
                <div class="demo-carousel-slide"><iframe class="demo-binder-frame" data-cat="pokemon" data-src="binder.html?demo=pokemon" title="Pokémon binder demo" scrolling="no"></iframe></div>
              </div>
            </div>
            <button class="demo-carousel-nav next" type="button" aria-label="Next binder">›</button>
          </div>
          <div class="demo-carousel-dots">
            <button class="dot active" type="button" data-i="0" aria-label="One Piece binder"></button>
            <button class="dot" type="button" data-i="1" aria-label="Pokémon binder"></button>
          </div>
        </div>
      </div>

      <div id="bindersWrap" style="display:none;">
        <div class="my-binders-header">
          <div>
            <h2 id="bindersTitle">My Binders</h2>
            <p class="text-muted-line" id="bindersCount"></p>
          </div>
          <button class="btn btn-filled" id="newBinderBtn">+ New Binder</button>
        </div>

        <div id="bindersGroups"></div>

        <!-- Inline new-binder form (hidden by default) -->
        <form id="newBinderForm" class="new-binder-form" style="display:none;">
          <h3>New Binder</h3>
          <div class="divider"></div>
          <div class="form-group">
            <label class="form-label" for="newBinderName">Binder Name</label>
            <input class="form-input" type="text" id="newBinderName" required placeholder="e.g. Trade Pile">
          </div>
          <div class="form-group">
            <label class="form-label">Game</label>
            <div class="pill-choice" id="newBinderCategory">
              <button type="button" class="pill-choice-btn active" data-value="optcg">One Piece TCG</button>
              <button type="button" class="pill-choice-btn" data-value="pokemon">Pokémon</button>
              <button type="button" class="pill-choice-btn" data-value="cyberpunk">Cyberpunk TCG</button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Flair</label>
            <div class="pill-choice" id="newBinderFlair">
              <button type="button" class="pill-choice-btn flair-trade active" data-value="trade">Trade Binder</button>
              <button type="button" class="pill-choice-btn flair-wishlist" data-value="wishlist">Wishlist Binder</button>
              <button type="button" class="pill-choice-btn flair-flex locked" data-value="flex" disabled>🔒 Flex Binder</button>
              <button type="button" class="pill-choice-btn flair-lgs locked" data-value="lgs" disabled>🔒 Local Game Store</button>
            </div>
          </div>
          <div style="display:flex; gap:1rem; margin-top: 1.5rem;">
            <button type="submit" class="btn btn-filled">Create</button>
            <button type="button" class="btn" id="cancelNewBinder">Cancel</button>
          </div>
          <p class="auth-error" id="newBinderError"></p>
        </form>
      </div>
    </div>
  </section>
