name: CI

# Lint + unit tests on every push and PR.
#
# NOTE: the Playwright e2e suite (`npm run e2e`) is NOT run here yet. The
# smoke specs hit the production Supabase project (anon, read-only) and the
# signed-in specs need TEST_EMAIL / TEST_PASSWORD secrets plus a test-account
# strategy. Wire it up once that's decided.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test
