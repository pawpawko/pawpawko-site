name: CI

# Lint + unit tests on every push and PR.
#
# NOTE: the Playwright e2e suite (`npm run e2e`) is NOT run here — it hits
# the production Supabase project (anon smoke + signed-in flows under the
# dedicated test account). It runs nightly instead: see e2e-nightly.yml.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Shared-HTML partials in sync
        run: npm run partials:check

      - name: Unit tests
        run: npm test
