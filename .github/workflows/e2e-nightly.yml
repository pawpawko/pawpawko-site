name: E2E (nightly)

# Full Playwright suite (anon smoke + signed-in flows) against production.
# Nightly rather than per-push: the signed-in specs write real rows to the
# production Supabase project (dedicated test account, cleaned up afterAll).
# TEST_EMAIL / TEST_PASSWORD are repo secrets; without them the signed-in
# specs skip and only the anon smoke suite runs.

on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC daily
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # The Playwright webServer runs `python -m http.server 8010`; python3 is
      # preinstalled (and aliased to `python`) on ubuntu-latest runners.
      - name: Run e2e suite
        run: npm run e2e
        env:
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
