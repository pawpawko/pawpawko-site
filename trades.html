  <section class="section binders-section" style="padding-top: 7rem;">
    <div class="container">
      <div id="setupNotice"></div>

      <div class="category-tabs" id="categoryTabs" role="tablist" aria-label="Filter by card game">
        <button class="category-tab active" type="button" role="tab" data-category="optcg" aria-selected="true">OPTCG</button>
        <button class="category-tab" type="button" role="tab" data-category="pokemon" aria-selected="false">Pokémon</button>
        <button class="category-tab" type="button" role="tab" data-category="cyberpunk" aria-selected="false">Cyberpunk</button>
      </div>

      <div class="trades-filters-top">
        <div class="filter-group filter-group-cards">
          <label class="form-label" for="filterCards">Cards</label>
          <div class="card-autocomplete">
            <input class="form-input" id="filterCards" type="text"
                   placeholder="OP01-001, ST15-003, …"
                   autocomplete="off" spellcheck="false">
            <div class="card-suggestions" id="cardSuggestions" role="listbox" hidden></div>
          </div>
        </div>
        <!-- Restore the last-used game synchronously while the body is
             still parsing — must come AFTER both #categoryTabs and
             #filterCards so we can touch them. The deferred trades.js
             repeats both flips idempotently once it runs. -->
        <script>(function(){try{var g=localStorage.getItem('pawpaw:lastGame');if(g!=='pokemon'&&g!=='optcg')return;var ts=document.getElementById('categoryTabs');if(ts){ts.querySelectorAll('.category-tab').forEach(function(t){var on=t.dataset.category===g;t.classList.toggle('active',on);t.setAttribute('aria-selected',on?'true':'false');});}var fc=document.getElementById('filterCards');if(fc)fc.placeholder=g==='pokemon'?'sv1-1, sv3pt5-160, …':'OP01-001, ST15-003, …';}catch(e){}})();</script>
        <div class="filter-group">
          <label class="form-label" for="citySelect">City</label>
          <select class="form-input" id="citySelect"></select>
        </div>
        <div class="filter-group">
          <label class="form-label">Borough</label>
          <div class="pill-dropdown">
            <button type="button" class="form-input pill-dropdown-btn" id="boroughBtn" aria-expanded="false">
              <span id="boroughLabel">Any</span>
              <svg class="chevron" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
            </button>
            <div class="pill-dropdown-panel" id="boroughPanel" hidden>
              <div class="filter-pills" id="boroughPills"></div>
            </div>
          </div>
        </div>
        <div class="filter-group">
          <label class="form-label">Subway Stop</label>
          <div class="pill-dropdown">
            <button type="button" class="form-input pill-dropdown-btn" id="subwayBtn" aria-expanded="false">
              <span id="subwayLabel">Any</span>
              <svg class="chevron" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
            </button>
            <div class="pill-dropdown-panel pill-dropdown-panel-tall" id="subwayPanel" hidden>
              <div class="filter-pills" id="subwayPills"></div>
            </div>
          </div>
        </div>
        <div class="filter-group">
          <label class="form-label">Local Card Shop</label>
          <input class="form-input" id="filterShop" placeholder="e.g. The Comic Lab">
        </div>
        <div class="filter-group filter-buttons">
          <button class="btn btn-filled" id="applyFilters">Apply</button>
          <button class="btn" id="clearFilters">Clear</button>
        </div>
      </div>

      <div class="trades-results">
        <p class="results-count" id="resultsCount">Loading binders…</p>
        <ul class="binder-list" id="binderList"></ul>
        <div class="binder-pagination" id="binderPagination"></div>
      </div>
    </div>
  </section>
